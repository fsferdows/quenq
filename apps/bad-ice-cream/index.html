<body>
  <div id="wrapper">
    <div id="head">
      <div id="logo"><a href="/"><img alt="onlinegames.stream Logo" src="/logo.svg" style="height:70px;"></a></div>
      <div id="head-mid">
        <p class="header-line1">Bad Ice-Cream</p>
        <p class="header-line2">Blow ice blocks, shatter obstacles, and devour all fruits while outsmarting monsters!</p>
      </div>
    </div>

      <div id="nav-H-Box">

          </ul>
        </div>

    </div>

    <div class="game-wrapper">
      <div class="hud">
        <div>Fruits Left: <span id="fruitVal" style="color:#ff7675;">0</span></div>
        <div>Level: <span id="levelVal" style="color:#ffeaa7;">1</span></div>
        <div>Score: <span id="scoreVal" style="color:#55efc4;">0</span></div>
      </div>
      <canvas id="gameCanvas" width="480" height="480"></canvas>
      
      <div class="touch-controls">
        <div class="touch-dpad">
          <button class="t-btn t-up" id="btn-up">▲</button>
          <button class="t-btn t-left" id="btn-left">◀</button>
          <button class="t-btn t-down" id="btn-down">▼</button>
          <button class="t-btn t-right" id="btn-right">▶</button>
        </div>
        <button class="action-btn-circle" id="btn-action">ICE<br>BREATHE</button>
      </div>
      <p style="font-size:12px; color:#a4b9be; margin-top:10px;">Arrow Keys / WASD to move. Spacebar or ICE button to create / break ice blocks!</p>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const fruitVal = document.getElementById('fruitVal');
    const levelVal = document.getElementById('levelVal');
    const scoreVal = document.getElementById('scoreVal');

    const COLS = 15;
    const ROWS = 15;
    const TILE = 32;

    // 0: empty, 1: solid wall, 2: ice block, 3: fruit
    let grid = [];
    let player = { x: 7, y: 13, dirX: 0, dirY: -1, dead: false };
    let enemies = [];
    let score = 0;
    let level = 1;
    let fruitsLeft = 0;

    function buildLevel() {
      grid = Array(ROWS).fill(0).map(() => Array(COLS).fill(0));
      // Outer borders
      for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
          if (r === 0 || r === ROWS - 1 || c === 0 || c === COLS - 1) {
            grid[r][c] = 1;
          }
        }
      }

      // Ice blocks maze
      for (let r = 2; r < ROWS - 2; r += 2) {
        for (let c = 2; c < COLS - 2; c++) {
          if (Math.random() > 0.35) grid[r][c] = 2;
        }
      }

      // Spawn Fruits
      fruitsLeft = 0;
      for (let r = 2; r < ROWS - 2; r++) {
        for (let c = 2; c < COLS - 2; c++) {
          if (grid[r][c] === 0 && Math.random() > 0.65) {
            grid[r][c] = 3;
            fruitsLeft++;
          }
        }
      }
      fruitVal.textContent = fruitsLeft;

      // Player
      player = { x: 7, y: 13, dirX: 0, dirY: -1, dead: false };
      grid[13][7] = 0;

      // Enemies
      enemies = [
        { x: 2, y: 2, dirX: 1, dirY: 0, speed: 0.05, step: 0 },
        { x: 12, y: 2, dirX: -1, dirY: 0, speed: 0.05, step: 0 }
      ];
    }

    function movePlayer(dx, dy) {
      if (player.dead) { buildLevel(); return; }
      player.dirX = dx;
      player.dirY = dy;
      const nx = player.x + dx;
      const ny = player.y + dy;

      if (grid[ny] && grid[ny][nx] !== undefined) {
        if (grid[ny][nx] === 0 || grid[ny][nx] === 3) {
          player.x = nx;
          player.y = ny;
          if (grid[ny][nx] === 3) {
            grid[ny][nx] = 0;
            score += 100;
            fruitsLeft--;
            scoreVal.textContent = score;
            fruitVal.textContent = fruitsLeft;
            if (fruitsLeft <= 0) {
              level++;
              levelVal.textContent = level;
              buildLevel();
            }
          }
        }
      }
    }

    function actionIce() {
      if (player.dead) { buildLevel(); return; }
      let targetX = player.x + player.dirX;
      let targetY = player.y + player.dirY;

      if (grid[targetY] && grid[targetY][targetX] === 2) {
        // Break line of ice
        while (grid[targetY] && grid[targetY][targetX] === 2) {
          grid[targetY][targetX] = 0;
          targetX += player.dirX;
          targetY += player.dirY;
        }
      } else if (grid[targetY] && grid[targetY][targetX] === 0) {
        // Create line of ice
        while (grid[targetY] && grid[targetY][targetX] === 0) {
          grid[targetY][targetX] = 2;
          targetX += player.dirX;
          targetY += player.dirY;
        }
      }
    }

    window.addEventListener('keydown', e => {
      if (['ArrowUp', 'KeyW'].includes(e.code)) movePlayer(0, -1);
      if (['ArrowDown', 'KeyS'].includes(e.code)) movePlayer(0, 1);
      if (['ArrowLeft', 'KeyA'].includes(e.code)) movePlayer(-1, 0);
      if (['ArrowRight', 'KeyD'].includes(e.code)) movePlayer(1, 0);
      if (['Space', 'KeyF'].includes(e.code)) actionIce();
    });

    document.getElementById('btn-up').addEventListener('click', () => movePlayer(0, -1));
    document.getElementById('btn-down').addEventListener('click', () => movePlayer(0, 1));
    document.getElementById('btn-left').addEventListener('click', () => movePlayer(-1, 0));
    document.getElementById('btn-right').addEventListener('click', () => movePlayer(1, 0));
    document.getElementById('btn-action').addEventListener('click', () => actionIce());

    function update() {
      if (player.dead) return;

      // Update enemies
      for (let en of enemies) {
        en.step++;
        if (en.step > 20) {
          en.step = 0;
          const dirs = [{x:1,y:0},{x:-1,y:0},{x:0,y:1},{x:0,y:-1}];
          const possible = dirs.filter(d => grid[en.y + d.y] && grid[en.y + d.y][en.x + d.x] === 0);
          if (possible.length > 0) {
            const chosen = possible[Math.floor(Math.random() * possible.length)];
            en.x += chosen.x;
            en.y += chosen.y;
          }
        }
        if (en.x === player.x && en.y === player.y) {
          player.dead = true;
        }
      }
    }

    function render() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
          const tile = grid[r][c];
          const px = c * TILE;
          const py = r * TILE;

          if (tile === 1) {
            // Wall
            ctx.fillStyle = '#2f3542';
            ctx.fillRect(px, py, TILE, TILE);
            ctx.strokeStyle = '#57606f';
            ctx.strokeRect(px, py, TILE, TILE);
          } else if (tile === 2) {
            // Ice Block
            ctx.fillStyle = '#70a1ff';
            ctx.fillRect(px + 2, py + 2, TILE - 4, TILE - 4);
            ctx.fillStyle = '#f1f2f6';
            ctx.fillRect(px + 4, py + 4, 6, 6);
          } else if (tile === 3) {
            // Fruit
            ctx.fillStyle = '#ff4757';
            ctx.beginPath();
            ctx.arc(px + TILE / 2, py + TILE / 2, 7, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#2ed573';
            ctx.fillRect(px + TILE / 2 - 1, py + 4, 3, 4);
          }
        }
      }

      // Player (Ice Cream)
      const ppx = player.x * TILE;
      const ppy = player.y * TILE;
      ctx.fillStyle = player.dead ? '#747d8c' : '#f8efba';
      ctx.beginPath();
      ctx.arc(ppx + TILE / 2, ppy + TILE / 2 - 2, 10, 0, Math.PI * 2);
      ctx.fill();
      // Eyes
      ctx.fillStyle = '#000';
      ctx.fillRect(ppx + TILE / 2 - 4 + player.dirX * 2, ppy + TILE / 2 - 4 + player.dirY * 2, 2, 4);
      ctx.fillRect(ppx + TILE / 2 + 2 + player.dirX * 2, ppy + TILE / 2 - 4 + player.dirY * 2, 2, 4);

      // Enemies
      for (let en of enemies) {
        const epx = en.x * TILE;
        const epy = en.y * TILE;
        ctx.fillStyle = '#e55039';
        ctx.fillRect(epx + 4, epy + 4, TILE - 8, TILE - 8);
        ctx.fillStyle = '#ffeaa7';
        ctx.fillRect(epx + 8, epy + 8, 4, 4);
        ctx.fillRect(epx + TILE - 12, epy + 8, 4, 4);
      }

      if (player.dead) {
        ctx.fillStyle = 'rgba(0,0,0,0.7)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#ff6b6b';
        ctx.font = 'bold 28px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('MELTED!', canvas.width / 2, canvas.height / 2 - 15);
        ctx.fillStyle = '#fff';
        ctx.font = '16px sans-serif';
        ctx.fillText('Tap or press any key to restart', canvas.width / 2, canvas.height / 2 + 25);
      }
    }

    function gameLoop() {
      update();
      render();
      requestAnimationFrame(gameLoop);
    }

    buildLevel();
    gameLoop();
  </script>
