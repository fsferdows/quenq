  <style>
    body { background: #0b0f14; margin: 0; padding: 0; overflow-x: hidden; color: #fff; }
    .game-wrapper {
      max-width: 860px;

    .hud {
      display: flex;

      box-shadow: 0 0 15px rgba(0,255,102,0.2);
    }

<body>
  <div id="wrapper">
    <div id="head">
      <div id="logo"><a href="/"><img alt="onlinegames.stream Logo" src="/logo.svg" style="height:70px;"></a></div>
      <div id="head-mid">
        <p class="header-line1">Slope</p>
        <p class="header-line2">Roll down the neon 3D slope at breakneck speed and avoid obstacles!</p>
      </div>
    </div>
    <div id="nav-H">
      <div id="nav-H-Box">
        <div id="butn-block">
          <ul>
            <li><a class="Butn1" href="/">Home</a></li>

          </ul>
        </div>
      </div>
    </div>

    <div class="game-wrapper">
      <div class="hud">
        <div>SCORE: <span id="scoreVal" style="color:#00ff66;">0</span></div>
        <div>BEST: <span id="bestVal" style="color:#00e5ff;">0</span></div>
      </div>
      <canvas id="gameCanvas" width="480" height="520"></canvas>
      
      <div class="touch-controls">
        <button class="steer-btn" id="btn-left">◀ STEER</button>
        <button class="steer-btn" id="btn-right">STEER ▶</button>
      </div>
      <p style="font-size:12px; color:#8ea1a6; margin-top:10px;">Use Left / Right Arrows, A / D keys, or touch buttons to steer the ball!</p>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreVal = document.getElementById('scoreVal');
    const bestVal = document.getElementById('bestVal');

    let best = parseInt(localStorage.getItem('slope_best') || '0', 10);
    bestVal.textContent = best;

    let ball = { x: 0, vx: 0, dead: false };
    let speed = 4;
    let distance = 0;
    let score = 0;
    let platforms = [];
    let keys = {};

    function initGame() {
      ball = { x: 0, vx: 0, dead: false };
      speed = 4;
      distance = 0;
      score = 0;
      scoreVal.textContent = score;
      platforms = [];

      for (let i = 0; i < 40; i++) {
        platforms.push({
          z: i * 35,
          width: 140,
          shiftX: (Math.sin(i * 0.4) * 40),
          obstacle: i > 5 && Math.random() > 0.65 ? (Math.random() > 0.5 ? -30 : 30) : null
        });
      }
    }

    window.addEventListener('keydown', e => {
      keys[e.code] = true;
      if (['ArrowLeft', 'ArrowRight', 'KeyA', 'KeyD'].includes(e.code)) e.preventDefault();
      if (ball.dead && e.code === 'Space') initGame();
    });
    window.addEventListener('keyup', e => {
      keys[e.code] = false;
    });

    const btnLeft = document.getElementById('btn-left');
    const btnRight = document.getElementById('btn-right');
    const setKey = (code, val) => (e) => { e.preventDefault(); keys[code] = val; if (ball.dead && val) initGame(); };
    btnLeft.addEventListener('touchstart', setKey('ArrowLeft', true));
    btnLeft.addEventListener('touchend', setKey('ArrowLeft', false));
    btnLeft.addEventListener('mousedown', setKey('ArrowLeft', true));
    btnLeft.addEventListener('mouseup', setKey('ArrowLeft', false));
    btnRight.addEventListener('touchstart', setKey('ArrowRight', true));
    btnRight.addEventListener('touchend', setKey('ArrowRight', false));
    btnRight.addEventListener('mousedown', setKey('ArrowRight', true));
    btnRight.addEventListener('mouseup', setKey('ArrowRight', false));

    canvas.addEventListener('click', () => { if (ball.dead) initGame(); });

    function update() {
      if (ball.dead) return;

      if (keys['ArrowLeft'] || keys['KeyA']) ball.vx -= 0.6;
      if (keys['ArrowRight'] || keys['KeyD']) ball.vx += 0.6;

      ball.vx *= 0.88;
      ball.x += ball.vx;

      speed = Math.min(10, 4 + distance * 0.002);
      distance += speed;
      score = Math.floor(distance / 10);
      scoreVal.textContent = score;
      if (score > best) {
        best = score;
        bestVal.textContent = best;
        localStorage.setItem('slope_best', best);
      }

      // Move platforms towards camera
      for (let p of platforms) {
        p.z -= speed;
      }

      // Check current platform under ball (z near 0)
      const currentP = platforms.find(p => p.z <= 25 && p.z >= -10);
      if (currentP) {
        const leftEdge = currentP.shiftX - currentP.width / 2;
        const rightEdge = currentP.shiftX + currentP.width / 2;

        if (ball.x < leftEdge || ball.x > rightEdge) {
          ball.dead = true;
        }

        if (currentP.obstacle !== null) {
          const obsX = currentP.shiftX + currentP.obstacle;
          if (Math.abs(ball.x - obsX) < 18) {
            ball.dead = true;
          }
        }
      }

      // Recycle platforms
      if (platforms[0].z < -40) {
        platforms.shift();
        const lastZ = platforms[platforms.length - 1].z;
        const lastIdx = platforms.length;
        platforms.push({
          z: lastZ + 35,
          width: Math.max(90, 140 - distance * 0.01),
          shiftX: Math.sin(lastIdx * 0.45) * 60,
          obstacle: Math.random() > 0.55 ? (Math.random() > 0.5 ? -35 : 35) : null
        });
      }
    }

    function project(x, y, z) {
      const fov = 280;
      const scale = fov / (z + fov);
      return {
        x: canvas.width / 2 + x * scale,
        y: canvas.height / 2 + y * scale + 60,
        scale
      };
    }

    function render() {
      ctx.fillStyle = '#05070a';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Draw horizon neon grid
      ctx.strokeStyle = '#00ff66';
      ctx.lineWidth = 1;

      // Draw platforms from back to front
      for (let i = platforms.length - 1; i >= 0; i--) {
        const p = platforms[i];
        if (p.z < 0) continue;

        const p1 = project(p.shiftX - p.width / 2, 70, p.z + 30);
        const p2 = project(p.shiftX + p.width / 2, 70, p.z + 30);
        const p3 = project(p.shiftX + p.width / 2, 70, p.z);
        const p4 = project(p.shiftX - p.width / 2, 70, p.z);

        ctx.fillStyle = '#0d1813';
        ctx.beginPath();
        ctx.moveTo(p1.x, p1.y);
        ctx.lineTo(p2.x, p2.y);
        ctx.lineTo(p3.x, p3.y);
        ctx.lineTo(p4.x, p4.y);
        ctx.closePath();
        ctx.fill();

        ctx.strokeStyle = '#00ff66';
        ctx.stroke();

        // Obstacle
        if (p.obstacle !== null) {
          const obs = project(p.shiftX + p.obstacle, 55, p.z + 15);
          const size = 18 * obs.scale;
          ctx.fillStyle = '#ff3838';
          ctx.fillRect(obs.x - size / 2, obs.y - size, size, size);
          ctx.strokeStyle = '#ffffff';
          ctx.strokeRect(obs.x - size / 2, obs.y - size, size, size);
        }
      }

      // Draw Ball (at z = 0)
      const bProj = project(ball.x, 62, 0);
      const bRadius = 14;

      ctx.fillStyle = ball.dead ? '#ff3838' : '#00e5ff';
      ctx.beginPath();
      ctx.arc(bProj.x, bProj.y, bRadius, 0, Math.PI * 2);
      ctx.fill();

      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(bProj.x - 3, bProj.y - 3, 4, 0, Math.PI * 2);
      ctx.stroke();

      if (ball.dead) {
        ctx.fillStyle = 'rgba(0,0,0,0.75)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#ff3838';
        ctx.font = 'bold 36px monospace';
        ctx.textAlign = 'center';
        ctx.fillText('CRASHED!', canvas.width / 2, canvas.height / 2 - 20);
        ctx.fillStyle = '#00ff66';
        ctx.font = '16px monospace';
        ctx.fillText('Press SPACE or TAP to roll again', canvas.width / 2, canvas.height / 2 + 30);
      }
    }

    function gameLoop() {
      update();
      render();
      requestAnimationFrame(gameLoop);
    }

    initGame();
    gameLoop();
  </script>
</body>
